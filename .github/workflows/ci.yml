name: Run CI
on:
  push:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md' # Do not need to run CI for markdown changes.
  pull_request:
    branches: [ main, 'feat/**' ]
    paths-ignore:
      - '**.md'

jobs:
  go-versions:
    uses: launchdarkly/gh-actions/.github/workflows/sdk-go-version-matrix.yml@main

  build-apex:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed if using OIDC to get release secrets.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
      - name: Install Salesforce CLI (sf)
        run: npm install @salesforce/cli --global

      - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
        name: 'Get secrets from AWS SSM'
        with:
          aws_assume_role: ${{ vars.AWS_ROLE_ARN }}
          ssm_parameter_pairs: '
            /production/common/releasing/apex/username = DEFAULT_USERNAME,
            /production/common/releasing/apex/consumer_key = SFDX_CONSUMER_KEY,
            /production/common/releasing/apex/server.key = SERVER_KEY'

      - name: Create server.key
        run: echo -n "$SERVER_KEY" > server.key

      - name: Authorize scratch organization
        run: |
          sf org login jwt \
            --username $DEFAULT_USERNAME \
            --client-id $SFDX_CONSUMER_KEY \
            --jwt-key-file server.key \
            --set-default \
            --alias target

      - name: Create scratch organization
        run: |
          sf org create scratch \
            --definition-file ./config/project-scratch-def.json \
            --alias github \
            --set-default \
            --target-dev-hub target

      - name: Deploy SDK
        run: sf project deploy start --source-dir force-app

      - name: Trigger unit tests
        run: sf apex run test --synchronous --test-level=RunAllTestsInOrg

  build-bridge:
    name: ${{ format('Bridge, Go {0}', matrix.go-version) }}
    runs-on: ubuntu-latest
    needs: go-versions

    strategy:
      # Let versions fail independently, so one broken toolchain does not hide the rest.
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          cd bridge
          go build .

      - name: Test
        run: |
          cd bridge
          go test -race ./...
